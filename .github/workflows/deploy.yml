name: Build & Deploy

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-paiement

jobs:
  # Détecte les apps modifiées et construit la matrice des jobs suivants.
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Modifier ce workflow redéploie les deux apps, pour pouvoir le tester.
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/deploy.yml'
            payments:
              - 'apps/stripe-paiement/**'
              - '.github/workflows/deploy.yml'

      - id: matrix
        run: |
          all='[
            {"key":"frontend","context":"apps/frontend","image":"sg-app-frontend","app":"ca-frontend"},
            {"key":"payments","context":"apps/stripe-paiement","image":"sg-app-paiement","app":"ca-payments"}
          ]'
          # Lancement manuel : tout redéployer.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed='["frontend","payments"]'
          else
            changed='${{ steps.filter.outputs.changes }}'
          fi
          apps=$(jq -c --argjson c "$changed" '[.[] | select(.key as $k | $c | index($k))]' <<< "$all")
          echo "Apps à déployer : $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # Construit et pousse sur Docker Hub uniquement les images modifiées.
  build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag :sha pour savoir exactement quel commit tourne, :latest pour Terraform.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Met à jour les Container Apps modifiées avec l'image du commit (Terraform ignore ce champ).
  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC : GitHub émet un token que Azure échange contre un accès
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ matrix.app }}
        run: |
          az containerapp update \
            --name ${{ matrix.app }} \
            --resource-group $RESOURCE_GROUP \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

      - name: Smoke test ${{ matrix.app }}
        run: |
          fqdn=$(az containerapp show -n ${{ matrix.app }} -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 6); do
            if curl -fsS --max-time 30 "https://$fqdn/health" | grep -qx ok; then
              echo "${{ matrix.app }} OK"; exit 0
            fi
            sleep 10
          done
          echo "${{ matrix.app }} ne répond pas"; exit 1
