name: Build & Deploy

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-paiement

jobs:
  # Construit les deux images en parallèle et les pousse sur Docker Hub.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: apps/frontend
            image: sg-app-frontend
          - context: apps/stripe-paiement
            image: sg-app-paiement
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag :sha pour savoir exactement quel commit tourne, :latest pour Terraform.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Met à jour les Container Apps avec l'image du commit (Terraform ignore ce champ).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC : GitHub émet un token que Azure échange contre un accès
      contents: read
    strategy:
      matrix:
        include:
          - app: ca-frontend
            image: sg-app-frontend
          - app: ca-payments
            image: sg-app-paiement
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ matrix.app }}
        run: |
          az containerapp update \
            --name ${{ matrix.app }} \
            --resource-group $RESOURCE_GROUP \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
